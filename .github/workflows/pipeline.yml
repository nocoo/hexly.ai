name: Pipeline

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    needs: [quality]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@3703a073693d598159e87f77f99587e586c14cfe  # v2026.24
    with:
      runtime-version: "1.4.4"
      node-version: "26.12.1"
      install-policy: project
      artifact-name: b1-dist
      artifact-path: dist
      deploy-script: "bun run deploy:worker"
      environment: production
      concurrency-group: hexly-ai-production
      timeout-minutes: 15
      verify-retries: 1
      verify-command: |
        bun run verify:production
        DEPLOY_URL=https://status.hexly.ai bun run verify:production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
