name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Complete verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      WRANGLER_LOG_PATH: ".wrangler/verification.log"
      WRANGLER_LOG_SANITIZE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: nocoo/base-ci/.github/actions/setup-js@081cdf665b9c67f233abfcc9242ce0be76ce2bb4
        with:
          package-manager: bun
          runtime-version: "1.4.0"
          node-version: "26.7.0"
          install-policy: project
      - uses: nocoo/base-ci/.github/actions/setup-security-scanners@86ff9032d75b2580f8ea6b0e10db3ca4ce054819
      - name: Install Chromium
        run: bun x playwright install --with-deps chromium
      - name: Verify
        run: bun run verify
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-failure
          path: |
            .test-results/
            .wrangler/verification.log
          retention-days: 7
