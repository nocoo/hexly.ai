name: Release
run-name: Deploy CI ${{ github.event.workflow_run.id || inputs.source-run-id }}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source-run-id:
        description: "Successful CI run ID to deploy"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    # The reusable workflow proves the CI run and requires the successful
    # `quality / Z1: Gate` check on that SHA before deploying.
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@777bbe4f9bacab8a91d8c01974480a6ee23d28e0  # v2026.15
    with:
      expected-workflow-path: ".github/workflows/ci.yml"
      expected-workflow-name: "CI"
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.source-run-id }}
      allowed-source-events: "push"
      required-quality-check: "quality / Z1: Gate"
      require-quality-check: true
      runtime-version: "1.4.4"
      node-version: "26.12.1"
      install-policy: "project"
      build-command: |
        bun run build
        bun run deploy:check
      deploy-script: "bun run deploy:worker"
      environment: production
      concurrency-group: hexly-ai-production
      timeout-minutes: 15
      verify-retries: 1
      verify-command: |
        bun run verify:production
        DEPLOY_URL=https://status.hexly.ai bun run verify:production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
