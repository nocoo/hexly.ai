name: Release
run-name: Deploy CI ${{ github.event.workflow_run.id || inputs.source-run-id }}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source-run-id:
        description: "Successful CI run ID to deploy"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  proof:
    name: Release source proof
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.source.outputs.target-sha }}
    steps:
      - name: Prove the source run and its Z1 check
        id: source
        uses: nocoo/base-ci/.github/actions/release-source@e4598815d171e2281f77f27a4800ff8fc2537f3f  # v2026.13
        with:
          github-token: ${{ github.token }}
          expected-workflow-path: ".github/workflows/ci.yml"
          expected-workflow-name: "CI"
          expected-branch: main
          source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.source-run-id }}
          allowed-source-events: "push"
          require-fresh-main: true
          required-quality-check: "quality / Z1: Gate"
          require-quality-check: true

  deploy:
    name: Deploy
    needs: proof
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@e4598815d171e2281f77f27a4800ff8fc2537f3f  # v2026.13
    with:
      expected-workflow-path: ".github/workflows/ci.yml"
      expected-workflow-name: "CI"
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.source-run-id }}
      source-sha: ${{ needs.proof.outputs.tested-sha }}
      allowed-source-events: "push"
      runtime-version: "1.4.4"
      node-version: "26.12.1"
      install-policy: "project"
      build-command: |
        bun run build
        bun run deploy:check
      deploy-script: "bun run deploy:worker"
      environment: production
      concurrency-group: hexly-ai-production
      timeout-minutes: 15
      verify-retries: 1
      verify-command: |
        bun run verify:production
        DEPLOY_URL=https://status.hexly.ai bun run verify:production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
