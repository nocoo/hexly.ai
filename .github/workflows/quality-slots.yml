# System0 quality slots, implemented natively for hexly.ai.
# Canonical check names are `quality / <ID>: <Name>`; `Z1: Gate` is the only
# required check. See docs/03-quality.md and nocoo/base-ci v2026.20.
name: Quality Slots

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"
  WRANGLER_LOG_PATH: ".wrangler/verification.log"
  WRANGLER_LOG_SANITIZE: "true"

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0  # v2026.20
        with:
          package-manager: bun
          runtime-version: "1.4.4"
          node-version: "26.12.1"
          install-policy: project

      - name: "S1: Types"
        run: bun run typecheck

      - name: Record SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0  # v2026.20
        with:
          package-manager: bun
          runtime-version: "1.4.4"
          node-version: "26.12.1"
          install-policy: project

      - name: "S2: Lint"
        run: bun run lint

      - name: Record SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: nocoo/base-ci/.github/actions/lint-workflows@e5876a604547b1ddb0916f16dd841a4f832609a0  # v2026.20

      - name: Record SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Scan secrets
        uses: nocoo/base-ci/.github/actions/scan-secrets@e5876a604547b1ddb0916f16dd841a4f832609a0  # v2026.20

      - name: Record SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Scan dependencies
        uses: nocoo/base-ci/.github/actions/scan-dependencies@e5876a604547b1ddb0916f16dd841a4f832609a0  # v2026.20
        with:
          lockfiles: "bun.lock"

      - name: Record SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0  # v2026.20
        with:
          package-manager: bun
          runtime-version: "1.4.4"
          node-version: "26.12.1"
          install-policy: project

      - name: "B1: Build"
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: b1-dist
          path: dist
          retention-days: 1

      - name: Record SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit:
    name: "L1: Unit"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0  # v2026.20
        with:
          package-manager: bun
          runtime-version: "1.4.4"
          node-version: "26.12.1"
          install-policy: project

      - name: "L1: Focus guard"
        run: bun run check:focus

      - name: "L1: Unit"
        run: bun run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Record SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  catalogue-and-media:
    name: "L1: Unit (Catalogue & Media)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0  # v2026.20
        with:
          package-manager: bun
          runtime-version: "1.4.4"
          node-version: "26.12.1"
          install-policy: project

      - name: Restore verified asset fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          path: .wrangler/asset-cache
          key: fixtures-v2-${{ runner.os }}-${{ hashFiles('docs/assets/inventory.json', 'scripts/prepare-test-assets.ts') }}
          restore-keys: fixtures-v2-${{ runner.os }}-

      - name: Verify tracked catalogue assets
        run: bun run assets:check-tracked

      - name: Prepare public test fixtures
        run: bun run assets:prepare-test

      - name: Verify current asset bytes and profiles
        run: bun scripts/verify-assets.ts

      - name: Verify share cards
        run: bun run social:check

      - name: Run asset suite
        run: bun run test:assets

      - name: Verify deployed revision (read only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          bun run verify:production
          DEPLOY_URL=https://status.hexly.ai bun run verify:production

      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: catalogue-verification-failure
          path: |
            .test-results/
            .wrangler/verification.log
          retention-days: 7

      - name: Record SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2_RUNTIME == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "L2 is not applicable; D1 binding is exercised in L1 via getPlatformProxy."

  l3-integration:
    name: "L3: Integration"
    needs:
      - b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0  # v2026.20
        with:
          package-manager: bun
          runtime-version: "1.4.4"
          node-version: "26.12.1"
          install-policy: project

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: b1-dist
          path: dist

      - name: Restore verified asset fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          path: .wrangler/asset-cache
          key: fixtures-v2-${{ runner.os }}-${{ hashFiles('docs/assets/inventory.json', 'scripts/prepare-test-assets.ts') }}
          restore-keys: fixtures-v2-${{ runner.os }}-

      - name: "L3: Integration"
        run: |
          bun run check:isolation
          bun run assets:prepare-test
          bunx playwright test --config playwright.http.config.ts

      - name: Retain failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: l3-integration-evidence
          path: .test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Record SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l4-e2e:
    name: "L4: E2E"
    needs:
      - b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0  # v2026.20
        with:
          package-manager: bun
          runtime-version: "1.4.4"
          node-version: "26.12.1"
          install-policy: project

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: b1-dist
          path: dist

      - name: Setup Playwright
        uses: nocoo/base-ci/.github/actions/setup-playwright@e5876a604547b1ddb0916f16dd841a4f832609a0  # v2026.20
        with:
          package-manager: bun
          browsers: chromium

      - name: Restore verified asset fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          path: .wrangler/asset-cache
          key: fixtures-v2-${{ runner.os }}-${{ hashFiles('docs/assets/inventory.json', 'scripts/prepare-test-assets.ts') }}
          restore-keys: fixtures-v2-${{ runner.os }}-

      - name: "L4: E2E"
        run: |
          bun run check:isolation
          bun run assets:prepare-test
          bunx playwright test

      - name: Retain failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: l4-e2e-evidence
          path: .test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Record SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  p1-package:
    name: "P1: Package"
    needs:
      - b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0  # v2026.20
        with:
          package-manager: bun
          runtime-version: "1.4.4"
          node-version: "26.12.1"
          install-policy: project

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: b1-dist
          path: dist

      - name: "P1: Package"
        run: bun run deploy:check

      - name: Record SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  z1-gate:
    name: "Z1: Gate"
    if: always()
    needs:
      - s1-types
      - s2-lint
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - l1-unit
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
      - catalogue-and-media
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.gate.outputs.tested-sha }}
    steps:
      - name: Verify quality slots
        id: gate
        uses: nocoo/base-ci/.github/actions/z1-gate@e5876a604547b1ddb0916f16dd841a4f832609a0  # v2026.20
        with:
          needs-json: ${{ toJSON(needs) }}
          expected-sha: ${{ github.sha }}
          required-jobs: |
            s1-types=S1: Types
            s2-lint=S2: Lint
            s3-workflow=S3: Workflow
            g1-secrets=G1: Secrets
            g2-dependencies=G2: Dependencies
            b1-build=B1: Build
            l1-unit=L1: Unit
            catalogue-and-media=L1: Unit (Catalogue & Media)
            l3-integration=L3: Integration
            l4-e2e=L4: E2E
            p1-package=P1: Package
          skipped-jobs: |
            l2-runtime=L2: Runtime
