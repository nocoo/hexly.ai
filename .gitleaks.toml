[extend]
useDefault = true

[[allowlists]]
description = "Generated artifacts and an independently verified stylesheet checksum"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)coverage/''',
  '''(^|/)\.wrangler/''',
  '''(^|/)\.test-results/''',
]
regexTarget = "line"
regexes = [
  '''^\s*"packages/basalt/src/styles/tokens\.css":\s*"fce5aac6e37046de963a65e29b99442327ebb3abe86da3a8677350ed939bfee4",?\s*$''',
]

[[allowlists]]
description = "Public brand and family-object locators in the R2 inventory key field"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)docs/assets/inventory\.json$''']
regexTarget = "match"
# Directory scanning can end a finding partway through a long JSON chunk.
# Keep the exception tied to this field, namespace, file and rule; credentials
# elsewhere in the inventory and brand paths in other files remain scanned.
regexes = ['''^key": "(?:brands|logos/family)/[a-z0-9-]+(?:/[A-Za-z0-9/_.-]*)?"?$''']

[[allowlists]]
description = "Rio's exact public Cloudflare Access JWT audience identifier"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)artwork/logo-family/rio/2026-09-20-01/input/wrangler\.jsonc\.txt$''']
regexTarget = "line"
regexes = ['''^\s*"ACCESS_AUD":\s*"163761e9258c70919bb5f4044e5408152f7985e7eb08e2d39e6905bd9a0c8b29",?\s*$''']
