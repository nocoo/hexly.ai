			body { margin: 0; }

			#startup-error { display: none; max-width: 36rem; margin: 18vh auto; padding: 0 24px; font: 16px/1.6 system-ui, sans-serif; }

			html[data-startup-error] #root { display: none; }
			html[data-startup-error] #startup-error { display: block; }
			#startup-error [lang="zh-CN"], html[lang="zh-CN"] #startup-error [lang="en"] { display: none; }
			html[lang="zh-CN"] #startup-error [lang="zh-CN"] { display: block; }
